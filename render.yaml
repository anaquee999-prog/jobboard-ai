services:
  - type: web
    name: jobboard-ai-app
    runtime: python
    plan: free
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt && cd dashboard_frontend && npm ci && npm run build
    startCommand: gunicorn app:app
    envVars:
      - key: JOBBOARD_SECRET_KEY
        sync: false
      - key: JOBBOARD_ADMIN_PHONE
        sync: false
      - key: JOBBOARD_ADMIN_PASSWORD
        sync: false
      - key: JOBBOARD_DATABASE_PATH
        value: instance/jobboard.db
      - key: JOBBOARD_BACKUP_DIR
        value: instance/backups
      - key: JOBBOARD_SESSION_COOKIE_SECURE
        value: "1"
      - key: JOBBOARD_CRON_TOKEN
        sync: false
      - key: JOBBOARD_SITE_URL
        value: https://jobboard-ai-app.onrender.com
      - key: JOBBOARD_API_BASE_URL
        value: https://jobboard-ai-app.onrender.com
      - key: JOBBOARD_SEO_SITE_NAME
        value: JobBoard
      - key: JOBBOARD_SEO_CITY
        value: Bangkok
      - key: JOBBOARD_SEO_REGION
        value: Bangkok
      - key: JOBBOARD_SEO_COUNTRY
        value: TH
      - key: JOBBOARD_SEO_KEYWORDS
        value: local jobs, job search, urgent jobs, government jobs, apply jobs, trusted jobs, job scam detection, Thailand jobs
